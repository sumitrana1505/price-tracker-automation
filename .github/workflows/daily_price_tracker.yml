name: Competitor Price Monitoring

on:
  schedule:
    # Runs daily at 03:15 UTC (08:45 AM IST) - offset from :00 to avoid GitHub queue delays
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      custom_date:
        description: 'Custom Date Header (leave blank for today e.g. 16th - Oct)'
        required: false
        default: ''
      test_limit:
        description: 'Limit number of products (leave blank to run all)'
        required: false
        default: ''

jobs:
  track-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Competitor Price Monitoring Brain
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          CUSTOM_DATE: ${{ github.event.inputs.custom_date }}
          TEST_LIMIT: ${{ github.event.inputs.test_limit }}
          TARGET_SHEET: 'Competitor price monitoring'
        run: |
          python price_tracker_engine.py

      - name: Commit and Push Updated Tracker to Repo (Backup)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add "PriceTracker (6).xlsx" || true
          git add PriceTracker*.xlsx || true
          git diff --staged --quiet || (git commit -m "Automated price tracker update (Competitor price monitoring): $(date -u +'%Y-%m-%d %H:%M:%S UTC')" && git push origin main)
