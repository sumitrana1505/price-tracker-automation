name: AZ_Ads_data

on:
  schedule:
    # Runs daily at 04:45 UTC (10:15 AM IST) - fills YESTERDAY's Amazon Ads numbers
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      custom_date:
        description: 'Date to fill as YYYY-MM-DD (leave blank for yesterday)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run - do not write to the Google Sheet'
        type: boolean
        default: false

concurrency: az-ads-data

jobs:
  az-ads-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # This repository is public: ADS_QUIET keeps ads numbers out of the log,
      # and the export file is deliberately NOT uploaded as an artifact.
      - name: Export Amazon Ads Products report and fill Ads_Data
        working-directory: az_ads
        env:
          AMAZON_ADS_STORAGE_STATE: ${{ secrets.AMAZON_ADS_STORAGE_STATE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          # Spreadsheet that holds the 'Ads_Data' tab. Uses ADS_SPREADSHEET_ID when that
          # secret exists, otherwise the same spreadsheet as the price tracker.
          SHEET_ID: ${{ secrets.ADS_SPREADSHEET_ID || secrets.GSHEET_SPREADSHEET_ID }}
          CUSTOM_DATE: ${{ github.event.inputs.custom_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          ADS_QUIET: '1'
        run: |
          xvfb-run -a python run.py --show $DRY_RUN
