name: FK_Ads_data

on:
  schedule:
    # Runs daily at 05:15 UTC (10:45 AM IST) - fills YESTERDAY's Flipkart Ads numbers
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - do not write to the Google Sheet'
        type: boolean
        default: false

# same group as AZ_Ads_data: both jobs add date columns to the same tab, never at the same time
concurrency: az-ads-data

jobs:
  fk-ads-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # This repository is public: ADS_QUIET keeps ads numbers out of the log,
      # and the report files are deliberately NOT uploaded as artifacts.
      - name: Download Flipkart Ads FSN reports and fill Ads_Data
        working-directory: fk_ads
        env:
          FLIPKART_ADS_STORAGE_STATE: ${{ secrets.FLIPKART_ADS_STORAGE_STATE }}
          # optional: used only when the saved session is no longer accepted
          FLIPKART_ADS_EMAIL: ${{ secrets.FLIPKART_ADS_EMAIL }}
          FLIPKART_ADS_PASSWORD: ${{ secrets.FLIPKART_ADS_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.ADS_SPREADSHEET_ID || secrets.GSHEET_SPREADSHEET_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          ADS_QUIET: '1'
        run: |
          xvfb-run -a python run.py --show $DRY_RUN
